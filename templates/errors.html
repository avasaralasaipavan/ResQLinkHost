{% extends "base.html" %}
{% block title %}{{ code }} &middot; {{ app_name }}{% endblock %}
{% block content %}
<main class="auth-wrap">
  <div class="container">
    <div class="auth-card text-center">
      <div class="card p-5">
        <div class="display-4 fw-bolder text-danger">{{ code }}</div>
        <h4 class="fw-bold mt-2">{{ title }}</h4>
        <p class="text-muted mt-2">{{ message }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-brand mt-3"><i class="bi bi-house"></i> Back to home</a>
      </div>
    </div>
  </div>
</main>
{% endblock %}
