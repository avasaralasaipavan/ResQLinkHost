{% extends "user/base_user.html" %}
{% block title %}Profile &middot; {{ app_name }}{% endblock %}
{% block user_content %}
<div class="mb-4">
  <h2 class="fw-bold mb-1">Profile</h2>
  <p class="text-muted mb-0">Keep your details up to date.</p>
</div>

<div class="row g-3">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h5 class="fw-bold mb-3"><i class="bi bi-person text-primary"></i> Personal details</h5>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="action" value="save_profile">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email (login)</label>
            <input type="email" class="form-control" value="{{ user.email }}" disabled>
            <div class="form-text">Email cannot be changed without re-verification.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Mobile number <span class="text-secondary">(optional)</span></label>
            <input type="tel" name="phone" class="form-control" value="{{ user.phone }}" placeholder="+91 98765 43210">
          </div>
          <button class="btn btn-brand" type="submit"><i class="bi bi-check2"></i> Save profile</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card">
      <div class="card-body">
        <h5 class="fw-bold mb-3"><i class="bi bi-key text-primary"></i> Change password</h5>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="action" value="change_password">
          <div class="mb-3">
            <label class="form-label">Current password</label>
            <input type="password" name="current_password" class="form-control" required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label">New password</label>
            <input type="password" name="new_password" class="form-control" minlength="6" required autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm new password</label>
            <input type="password" name="confirm_password" class="form-control" minlength="6" required autocomplete="new-password">
          </div>
          <button class="btn btn-outline-danger" type="submit"><i class="bi bi-shield-lock"></i> Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
