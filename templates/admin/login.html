{% extends "base.html" %}
{% block title %}Admin Login &middot; {{ app_name }}{% endblock %}
{% block content %}
<main class="auth-wrap">
  <div class="container">
    <div class="auth-card">
      <div class="card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="mx-auto mb-3 bg-brand-light rounded-circle d-flex align-items-center justify-content-center" style="width:64px;height:64px;">
            <i class="bi bi-shield-fill-check text-primary" style="font-size:1.6rem;"></i>
          </div>
          <h4 class="fw-bold mb-0">Admin console</h4>
          <p class="text-muted small">Restricted access for platform administrators.</p>
        </div>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Admin email</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button class="btn btn-brand btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
        </form>
        <p class="text-muted small text-center mt-4 mb-0">
          Default (dev): admin@resqlink.app / admin123 &middot; change via environment variables.
        </p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
