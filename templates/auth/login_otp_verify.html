{% extends "main_nav.html" %}
{% block title %}Enter Login Code &middot; {{ app_name }}{% endblock %}
{% block content %}
<main class="auth-wrap">
  <div class="container">
    <div class="auth-card">
      <div class="card p-4 p-md-5">
        <h4 class="fw-bold mb-1"><i class="bi bi-shield-check text-primary"></i> Enter your login code</h4>
        <p class="text-muted small mb-4">We emailed a 6-digit code to <strong>{{ email }}</strong>.</p>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">6-digit code</label>
            <input type="text" name="otp" class="form-control otp-input" pattern="[0-9]{6}" inputmode="numeric" maxlength="6" placeholder="______" required autofocus>
          </div>
          <button class="btn btn-brand btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Verify &amp; log in</button>
        </form>
        <form method="post" action="{{ url_for('auth_login_otp_resend') }}" class="text-center mt-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-link btn-sm" type="submit"><i class="bi bi-arrow-clockwise"></i> Resend code</button>
        </form>
        <p class="text-center small mt-1 mb-0"><a href="{{ url_for('auth_login') }}">Try password instead</a></p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
