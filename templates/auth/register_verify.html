{% extends "main_nav.html" %}
{% block title %}Verify Email &middot; {{ app_name }}{% endblock %}
{% block content %}
<main class="auth-wrap">
  <div class="container">
    <div class="auth-card">
      <div class="card p-4 p-md-5">
        <h4 class="fw-bold mb-1"><i class="bi bi-shield-check text-primary"></i> Verify your email</h4>
        <p class="text-muted small mb-1">A 6-digit code was sent to <strong>{{ email }}</strong>.</p>
        <p class="text-muted small mb-4">Enter it below. Your account is created only after the code is confirmed.</p>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">6-digit verification code</label>
            <input type="text" name="otp" class="form-control otp-input" pattern="[0-9]{6}" inputmode="numeric" maxlength="6" placeholder="______" required autofocus>
          </div>
          <button class="btn btn-brand btn-lg w-100" type="submit"><i class="bi bi-check2-circle"></i> Verify &amp; create account</button>
        </form>
        <form method="post" action="{{ url_for('auth_register_resend') }}" class="text-center mt-3">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-link btn-sm" type="submit"><i class="bi bi-arrow-clockwise"></i> Resend code</button>
        </form>
        <p class="text-center small mt-1 mb-0"><a href="{{ url_for('auth_register') }}">Change email or start over</a></p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
