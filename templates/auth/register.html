{% extends "main_nav.html" %}
{% block title %}Create Account &middot; {{ app_name }}{% endblock %}
{% block content %}
<main class="auth-wrap">
  <div class="container">
    <div class="auth-card">
      <div class="card p-4 p-md-5">
        <h4 class="fw-bold mb-1"><i class="bi bi-person-plus text-primary"></i> Create your account</h4>
        <p class="text-muted small mb-4">Step 1 of 2: we&rsquo;ll email you a one-time code to confirm it&rsquo;s really you.</p>
        <form method="post" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="full_name" class="form-control" placeholder="e.g. Ananya Rao" value="{{ form.get('full_name', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" value="{{ form.get('email', '') }}" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" minlength="6" required autocomplete="new-password">
          </div>
          <button class="btn btn-accent btn-lg w-100" type="submit"><i class="bi bi-envelope-check"></i> Send verification code</button>
        </form>
        <p class="text-muted small text-center mt-4 mb-0">Already registered? <a href="{{ url_for('auth_login') }}">Log in</a></p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
