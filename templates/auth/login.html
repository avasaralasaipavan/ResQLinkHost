{% extends "main_nav.html" %}
{% block title %}Log in &middot; {{ app_name }}{% endblock %}
{% block content %}
<main class="auth-wrap">
  <div class="container">
    <div class="auth-card">
      <div class="card p-4 p-md-5">
        <h4 class="fw-bold mb-3"><i class="bi bi-box-arrow-in-right text-primary"></i> Log in to ResQLink</h4>

        <ul class="nav nav-pills nav-justified gap-2 mb-4" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link w-100 {{ 'active' if mode != 'otp' else '' }}" data-bs-toggle="tab" data-bs-target="#tab-password" type="button"><i class="bi bi-key"></i> Password</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link w-100 {{ 'active' if mode == 'otp' else '' }}" data-bs-toggle="tab" data-bs-target="#tab-otp" type="button"><i class="bi bi-envelope-check"></i> Email + OTP</button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade {{ 'show active' if mode != 'otp' else '' }}" id="tab-password">
            <form method="post" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input type="hidden" name="mode" value="password">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ form.get('email', '') }}" required autocomplete="email">
              </div>
              <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required autocomplete="current-password">
              </div>
              <button class="btn btn-brand btn-lg w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
            </form>
          </div>
          <div class="tab-pane fade {{ 'show active' if mode == 'otp' else '' }}" id="tab-otp">
            <form method="post" novalidate>
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <input type="hidden" name="mode" value="otp">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ form.get('email', '') }}" required autocomplete="email">
              </div>
              <p class="text-muted small">A one-time code will be emailed to you to complete login &mdash; no password needed.</p>
              <button class="btn btn-accent btn-lg w-100" type="submit"><i class="bi bi-send-check"></i> Send me a code</button>
            </form>
          </div>
        </div>
        <p class="text-muted small text-center mt-4 mb-0">New to ResQLink? <a href="{{ url_for('auth_register') }}">Create account</a></p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
